<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contractor Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="LogoColor.png" />
  <style>
    body {
      margin: 0; padding: 0; font-family: Arial, sans-serif;
      position: relative; min-height: 100vh;
      background: url('19.webp') no-repeat center center fixed;
      background-size: cover;
    }
    body::before { content:""; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 0; }
    .container { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .logo { width: 80px; display: block; margin: 0 auto 1rem; }
    form { background:#fff; padding:2rem; border-radius:10px; box-shadow:0 0 20px rgba(0,0,0,.2); max-width:400px; width:100%; }
    h2 { text-align:center; margin-bottom:1.5rem; color:#222; }
    label { display:block; margin-bottom:.5rem; font-weight: bold; }
    input { width:100%; padding:.6rem; margin-bottom:1.2rem; border:1px solid #ccc; border-radius:5px; }
    button { width:100%; padding:.8rem; background:#28a745; color:#fff; font-weight:bold; border:none; border-radius:5px; cursor:pointer; transition:.3s; }
    button:hover { background:#218838; }

    /* Success Overlay */
    .success-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.85); color:#fff;
      display: none; align-items: center; justify-content: center; z-index: 9999;
      text-align:center; padding: 1.5rem;
    }
    .success-card {
      background:#111; border:1px solid rgba(255,255,255,.1);
      border-radius: 12px; padding: 2rem; max-width: 520px; width:100%;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    .success-card h3 { margin:0 0 .75rem; font-size:1.4rem; }
    .success-card p { margin:.5rem 0 1.25rem; color:#ddd; }
    .btn-primary {
      border-radius:10px; padding:.9rem 1rem; width:100%;
      background:#28a745; color:#fff; border:none; cursor:pointer; font-weight:700;
    }
    .btn-primary:hover { background:#218838; }
  </style>
</head>
<body>
  <div class="container">
    <form id="form">
      <img src="LogoColor.png" alt="Logo" class="logo" />
      <h2>Contractor Application</h2>

      <label>Name:</label>
      <input type="text" id="name" name="name" required placeholder="Your full name" />

      <label>Company:</label>
      <input type="text" id="company" name="company" required placeholder="Company name" />

      <label>Email:</label>
      <input type="email" id="email" name="email" required placeholder="Email address" />

      <label>Phone:</label>
      <input
        type="tel" id="phone" name="phone" required
        placeholder="Phone number (numbers only)"
        oninput="this.value = this.value.replace(/\\D/g,'')"
      />

      <button type="submit">Send</button>
    </form>
  </div>

  <!-- SUCCESS MODAL -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-card">
      <h3>✅ Message Sent Successfully</h3>
      <p>We’ll be in touch shortly.</p>
      <button class="btn-primary" id="backBtn">Return to Website</button>
    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const successOverlay = document.getElementById("successOverlay");
    const backBtn = document.getElementById("backBtn");

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnydRo_V1O8QLALnGSkIqTbhl8AQYf9NECdq9A2HbCTfA8bbLTbP7Gawrj9YpQ6_l1Ww/exec";
    const PHONE = "13465819082";
    const DEST_URL = "https://www.newgenpatio.com/";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const company = document.getElementById("company").value.trim();

      // Open WhatsApp immediately (no popup block)
      const msg = `Hi! I'm contractor ${name} from ${company} and I'd like to work with your team!`;
      window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`, "_blank", "noopener,noreferrer");

      // Send to Google Sheets (no-cors safe)
      const fd = new FormData(form);
      Array.from(form.elements).forEach(el => el.disabled = true);

      try {
        await fetch(SCRIPT_URL, { method: "POST", body: fd, mode: "no-cors" });
        successOverlay.style.display = "flex";
        form.reset();
      } catch (err) {
        alert("Submission error. Please try again.");
        Array.from(form.elements).forEach(el => el.disabled = false);
      }
    });

    // Return button
    backBtn.addEventListener("click", () => {
      window.open(DEST_URL, "_blank", "noopener");
      try { window.open("", "_self"); window.close(); } catch {}
      window.location.replace(DEST_URL);
    });
  </script>
</body>
</html>
